name: .NET Release

on:
  push:
    tags:
      - 'dotnet-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.11.0)'
        required: true
        type: string

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#dotnet-}" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack and install the skill of the packed Ogooreck with dotnet-package-skills
        working-directory: src/dotnet
        run: ./build.sh --no-color test-skill
        env:
          Version: ${{ steps.version.outputs.version }}

      - name: NuGet login
        uses: NuGet/login@v1.2.0
        id: login
        with:
          user: oskar.dudycz

      # Pushes the matching .snupkg symbols package automatically
      - name: Publish to NuGet
        working-directory: src/dotnet
        run: dotnet nuget push "./artifacts/*.nupkg" -s https://api.nuget.org/v3/index.json -k ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: dotnet-${{ steps.version.outputs.version }}
          name: Ogooreck .NET ${{ steps.version.outputs.version }}
          generate_release_notes: true
