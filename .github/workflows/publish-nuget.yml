name: NuGet Manual Publish

on: [workflow_dispatch]

env:
    config: Release
    DOTNET_CLI_TELEMETRY_OPTOUT: 1
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
    dotnet_core_version: 10.0.x

jobs:
    publish_job:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v7.0.1

            - name: Install .NET
              uses: actions/setup-dotnet@v6.1.0
              with:
                  dotnet-version: ${{ env.dotnet_core_version }}

            - name: Run Pack
              run: ./build.sh --no-color pack
              shell: bash

            - name: NuGet login
              uses: NuGet/login@v1.2.0
              id: login
              with:
                  user: oskar.dudycz

            # Pushes the matching .snupkg symbols package automatically
            - name: Publish to NuGet
              run: dotnet nuget push "./artifacts/*.nupkg" -s https://api.nuget.org/v3/index.json -k ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate
              shell: bash
