name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Check Out Repo
              uses: actions/checkout@v7.0.1

            - name: Install .NET 10
              uses: actions/setup-dotnet@v6.1.0
              with:
                  dotnet-version: "10.0.x"

            - name: Build and Test
              run: ./build.sh test
